<!doctype html>
<!-- Link-preview image (1200×630). Rendered to web/public/og.png by: node web/og/render.mjs -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative;
    background:
      radial-gradient(700px 420px at 1080px 40px, rgba(99, 91, 255, 0.30), transparent 70%),
      radial-gradient(560px 360px at 80px 640px, rgba(34, 195, 166, 0.16), transparent 70%),
      #0e1016;
    color: #e9ebf3;
    font-family: "Segoe UI", Inter, system-ui, sans-serif;
  }
  #cipher {
    position: absolute; inset: 0 0 110px 560px;
    padding: 28px 40px 0 0;
    font: 500 19px/1.55 Consolas, ui-monospace, monospace;
    color: #8b85ff; opacity: 0.12;
    white-space: pre; overflow: hidden; text-align: right;
    -webkit-mask-image: linear-gradient(90deg, transparent, #000 45%), linear-gradient(180deg, #000 70%, transparent);
    mask-image: linear-gradient(90deg, transparent, #000 45%), linear-gradient(180deg, #000 70%, transparent);
    -webkit-mask-composite: source-in;
    mask-composite: intersect;
  }
  .wrap { position: relative; height: 100%; padding: 64px 72px 60px; display: flex; flex-direction: column; }
  .top { display: flex; align-items: center; gap: 18px; }
  .logo { width: 56px; height: 56px; border-radius: 16px; background: #4f46e5; display: grid; place-items: center; }
  .logo i { width: 24px; height: 24px; border-radius: 6px; background: #22c3a6; }
  .brand { font-size: 34px; font-weight: 600; letter-spacing: -0.01em; }
  .chip { margin-left: auto; font-size: 22px; color: #c9cdf9; background: #14162a; border: 1.5px solid #3a3f63; border-radius: 999px; padding: 8px 20px; }
  h1 { margin-top: 92px; font-size: 88px; line-height: 1.02; font-weight: 700; letter-spacing: -0.025em; color: #ffffff; }
  .sub { margin-top: 26px; font-size: 33px; line-height: 1.35; color: #b8bdd0; max-width: 960px; }
  .bottom { margin-top: auto; display: flex; align-items: center; gap: 14px; }
  .pill { font-size: 23px; color: #e9ebf3; background: #1b1f2e; border: 1.5px solid #2b3045; border-radius: 12px; padding: 10px 18px; }
  .pill b { color: #4cd394; font-weight: 600; margin-right: 8px; }
  .by { margin-left: auto; font-size: 23px; color: #9aa0b4; }
</style>
</head>
<body>
<div id="cipher"></div>
<div class="wrap">
  <div class="top">
    <div class="logo"><i></i></div>
    <div class="brand">Encrypted Account</div>
    <div class="chip">Sepolia testnet</div>
  </div>
  <h1>A stolen key isn't enough.</h1>
  <p class="sub">A smart account whose PIN lives in the contract, checked under FHE. The spending rules stay encrypted.</p>
  <div class="bottom">
    <span class="pill"><b>✓</b>PIN counted on-chain</span>
    <span class="pill"><b>✓</b>Hidden limits</span>
    <span class="pill"><b>✓</b>Open source</span>
    <span class="by">Built with Zama FHEVM</span>
  </div>
</div>
<script>
  // Deterministic "ciphertext" texture, so the image renders the same every time.
  let s = 0x5eed1234;
  const rnd = () => ((s = (Math.imul(s, 1664525) + 1013904223) >>> 0) / 2 ** 32);
  const hex = (n) => Array.from({ length: n }, () => "0123456789abcdef"[Math.floor(rnd() * 16)]).join("");
  const lines = [];
  for (let i = 0; i < 22; i++) lines.push(`0x${hex(16)} ${hex(16)} ${hex(8)}`);
  document.getElementById("cipher").textContent = lines.join("\n");
</script>
</body>
</html>
